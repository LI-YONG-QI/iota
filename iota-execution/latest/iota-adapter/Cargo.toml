[package]
name = "iota-adapter-latest"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Adapter and accompanying CLI for local iota development"

[lints]
workspace = true

[dependencies]
# external dependencies
anyhow = { workspace = true, features = ["backtrace"] }
bcs.workspace = true
leb128.workspace = true
parking_lot.workspace = true
serde.workspace = true
tracing.workspace = true

# internal dependencies
iota-macros.workspace = true
iota-metrics = { workspace = true, optional = true }
iota-move-natives = { path = "../iota-move-natives", package = "iota-move-natives-latest", default-features = false }
iota-protocol-config.workspace = true
iota-types.workspace = true
iota-verifier = { path = "../iota-verifier", package = "iota-verifier-latest", default-features = false }
move-binary-format.workspace = true
move-bytecode-utils.workspace = true
move-bytecode-verifier = { path = "../../../external-crates/move/crates/move-bytecode-verifier" }
move-bytecode-verifier-meter.workspace = true
move-core-types.workspace = true
move-vm-config.workspace = true
move-vm-profiler = { path = "../../../external-crates/move/crates/move-vm-profiler" }
move-vm-runtime = { path = "../../../external-crates/move/crates/move-vm-runtime" }
move-vm-types.workspace = true

[features]
default = ["risc0-hack", "risc0-hack-gas", "risc0-hack-metrics"]
# Enables the use of standard `GasCharger`.
# If disabled then "noop" `GasCharger` is used.
# The feature enables certain arguments in the public API and redefines
# the `GasCharger` type, thus it breaks compatibility.
# The feature must be disabled in risc0 guests.
risc0-hack-gas = []
# Enables the use of standard `LimitsMetrics`.
# If disabled then "noop" `LimitsMetrics` from `iota-move-natives` is used.
# The feature must be disabled in risc0 guests.
risc0-hack-metrics = ["iota-move-natives/risc0-hack-metrics"]
# Enables the use of `target_os = "zkvm"` incompatible stuff in dependencies.
# If disabled the crates can still be used for the adapter purposes.
# The feature must be disabled in risc0 guests.
risc0-hack = [
  "dep:iota-metrics",
  "iota-move-natives/risc0-hack",
  "iota-protocol-config/risc0-hack",
  "iota-types/risc0-hack",
]
gas-profiler = [
  "iota-types/gas-profiler",
  "move-vm-config/gas-profiler",
  "move-vm-profiler/gas-profiler",
  "move-vm-runtime/gas-profiler",
  "move-vm-types/gas-profiler",
]
