[package]
name = "move-disassembler"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Print a human-readable version of Move bytecode (.mv files)"

[dependencies]
anyhow.workspace = true
colored = { workspace = true, optional = true }

move-abstract-interpreter.workspace = true
move-binary-format.workspace = true
move-bytecode-source-map.workspace = true
move-command-line-common.workspace = true
move-compiler.workspace = true
move-core-types.workspace = true
move-coverage.workspace = true
move-ir-types.workspace = true

bcs.workspace = true
clap = { workspace = true, optional = true }
hex.workspace = true

[features]
default = ["risc0-hack"]
risc0-hack = [
  "move-bytecode-source-map/risc0-hack",
  "move-command-line-common/risc0-hack",
  "move-compiler/risc0-hack",
  "move-coverage/risc0-hack",
  "move-ir-types/risc0-hack",
  "dep:clap",
  "dep:colored",
]
