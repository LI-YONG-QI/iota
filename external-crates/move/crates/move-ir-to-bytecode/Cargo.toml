[package]
name = "move-ir-to-bytecode"
version = "0.1.0"
authors = ["IOTA Foundation <info@iota.org>"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Move ir to bytecode"

[dependencies]
anyhow.workspace = true
codespan-reporting.workspace = true
log.workspace = true
move-binary-format.workspace = true
move-bytecode-source-map.workspace = true
move-command-line-common.workspace = true
move-core-types.workspace = true
move-ir-to-bytecode-syntax.workspace = true
move-ir-types.workspace = true
move-symbol-pool.workspace = true
ouroboros.workspace = true

[features]
default = ["risc0-hack"]
risc0-hack = [
  "move-bytecode-source-map/risc0-hack",
  "move-command-line-common/risc0-hack",
  "move-ir-to-bytecode-syntax/risc0-hack",
  "move-ir-types/risc0-hack",
]
